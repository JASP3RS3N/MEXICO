server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permite embeber la app como pestaña de Microsoft Teams ("Website tab").
    # frame-ancestors reemplaza a X-Frame-Options en navegadores modernos: se
    # deja en 'self' + los dominios de Teams, así que cualquier otro sitio
    # sigue sin poder meter la app en un iframe.
    #
    # Ojo: Teams además exige HTTPS. En la red de la empresa eso significa
    # poner un proxy inverso con certificado (ver CORRER_LOCAL.md); esta
    # cabecera es la mitad del requisito, no todo.
    add_header Content-Security-Policy "frame-ancestors 'self' https://teams.microsoft.com https://*.teams.microsoft.com https://*.skype.com https://*.microsoft.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback: let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
