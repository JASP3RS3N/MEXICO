services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: smokehouse
      JWT_SECRET: cambia-esto-en-produccion
      CORS_ORIGINS: http://localhost:3000
      SEED_DEMO: "true"
      # --- Asistente IA (LM Studio) ---
      AI_ENABLED: "true"
      # LM Studio en la MISMA PC: deja host.docker.internal.
      # LM Studio en otra máquina por Tailscale: usa http://TU-IP-TAILSCALE:1234/v1
      LMSTUDIO_BASE_URL: "http://host.docker.internal:1234/v1"
      # Opcional: fija un modelo; si se deja vacío usa el que esté cargado.
      LMSTUDIO_MODEL: ""
    extra_hosts:
      # Permite que el contenedor llegue a LM Studio corriendo en el host.
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8001
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
